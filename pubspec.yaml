name: pawlypaint
description: A cozy jewel painting game with picross-style courses.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Original loops composed by tool/compose_music.py (no third-party audio).
    - assets/music/
  fonts:
    # Variable font (weights 300-700), SIL Open Font License: assets/fonts/OFL.txt
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
