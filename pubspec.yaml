name: pawlypaint
description: A cozy jewel painting game with picross-style courses.
publish_to: 'none'
version: 0.10.0+25

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  gal: ^2.3.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Original loops composed by tool/compose_music.py (no third-party audio).
    - assets/music/
    - assets/sfx/
  fonts:
    # Variable font (weights 300-700), SIL Open Font License: assets/fonts/OFL.txt
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf

flutter_launcher_icons:
  # Icon art is drawn by tool/make_icon.py.
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FCE4EC"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
